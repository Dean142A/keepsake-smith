name: Build and Deploy to Bunny.net Magic Containers

on:
  push:
    branches:
      - main
  # Pull requests build the image to prove it still compiles. They never
  # publish or deploy — see the guards on the steps below.
  pull_request:
    branches:
      - main
  # Allows the deploy to be re-run on demand, e.g. to retest Bunny
  # credentials without having to push to main.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image to ghcr.io
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          # Build everywhere, publish only from main and manual runs.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deliberately NOT continue-on-error: a failed rolling update must fail
      # the run. Eight consecutive runs reported success while this step errored
      # with "Could not obtain app configuration: HTTP status 404", which hid a
      # mistyped APP_ID for a week.
      #
      # The previous `if:` guard tested env.BUNNY_API_KEY, which was defined in
      # this step's own env block and so never gated anything. Removed.
      - name: Trigger Rolling Update on Bunny Magic Containers
        if: github.event_name != 'pull_request'
        # Pinned to a commit rather than @main: a moving ref means an upstream
        # change could run unreviewed code against production with our API key.
        # 931a74b = BunnyWay/actions "Version Packages (#48)", 2026-10-12 — the
        # exact commit verified working in run 45398252948.
        uses: BunnyWay/actions/container-update-image@931a74b9c45ea9f9f01435fbbf1649830e67d3b3
        with:
          app_id: ${{ vars.APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: keepsake-smith
          image_tag: latest
