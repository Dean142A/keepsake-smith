version: '3.8'

services:
  # Main Storefront & Custom Application
  storefront:
    build: .
    container_name: keepsake_storefront
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000

  # Nginx Reverse Proxy for Subdomain Routing
  nginx-proxy:
    image: nginx:alpine
    container_name: keepsake_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - storefront
