events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 25M;

    # Rate Limiting: 10 requests per second per IP for API endpoints
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Main Storefront: www.thekeepsakesmith.com / thekeepsakesmith.com
    server {
        listen 80;
        server_name www.thekeepsakesmith.com thekeepsakesmith.com;

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://storefront:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://storefront:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Portal: app.thekeepsakesmith.com
    server {
        listen 80;
        server_name app.thekeepsakesmith.com;

        location /_next/ {
            proxy_pass http://storefront:3000/_next/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://storefront:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /textures/ {
            proxy_pass http://storefront:3000/textures/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /audios/ {
            proxy_pass http://storefront:3000/audios/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://storefront:3000/portal;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # Admin CMS: admin.thekeepsakesmith.com
    server {
        listen 80;
        server_name admin.thekeepsakesmith.com;

        location /_next/ {
            proxy_pass http://storefront:3000/_next/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://storefront:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /textures/ {
            proxy_pass http://storefront:3000/textures/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /audios/ {
            proxy_pass http://storefront:3000/audios/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://storefront:3000/admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # API: api.thekeepsakesmith.com
    server {
        listen 80;
        server_name api.thekeepsakesmith.com;

        location / {
            proxy_pass http://storefront:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}

